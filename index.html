<style>
  :root {
    --ninox-blue: #4970ff; --ninox-blue-strong: #2e4fe0; --ninox-blue-soft: #e6ecff;
    --slate-dark: #1f2026; --slate-mid: #4e4f56; --slate-light: #83858f;
    --sand-dark: #cfcdc6; --sand-light: #e6e4dd; --slate-faint: #f7f6f3;
    --radius-md: 12px; --radius-lg: 18px;
    --shadow-md: 0 6px 18px rgba(31,32,38,.08), 0 2px 6px rgba(31,32,38,.04);
    --bs-body-font-family: "Noto Sans", Arial, sans-serif;
    --bs-body-bg: var(--slate-faint); --bs-body-color: var(--slate-dark);
    --bs-primary: var(--ninox-blue);
  }
  .hero { background: linear-gradient(135deg, #4970FF 0%, #A78BFA 100%); color: #fff; }
  .hero h1 { font-weight: 500; letter-spacing: -.01em; }
  .card-list { background: #fff; border: 1px solid var(--sand-dark); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
  .btn-ninox { background: var(--ninox-blue); border-color: var(--ninox-blue); color: #fff; font-weight: 500; }
  .btn-ninox:hover, .btn-ninox:focus-visible { background: var(--ninox-blue-strong); border-color: var(--ninox-blue-strong); color: #fff; }
  .form-control:focus, .form-check-input:focus { border-color: var(--ninox-blue); box-shadow: 0 0 0 .2rem rgba(73,112,255,.25); }
  .form-check-input:checked { background-color: var(--ninox-blue); border-color: var(--ninox-blue); }
  .todo { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--sand-light); }
  .todo:last-child { border-bottom: 0; }
  .todo .form-check-input { width: 1.4rem; height: 1.4rem; margin: 0; flex: none; cursor: pointer; }
  .todo .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .todo.done .txt { text-decoration: line-through; color: var(--slate-light); }
  .todo.important { border-left: 4px solid #f97316; }
  .star, .del { border: 0; background: transparent; font-size: 1.2rem; line-height: 1; padding: 4px 8px; border-radius: 8px; color: var(--slate-light); }
  .star:hover, .del:hover { background: var(--sand-light); }
  .star.on { color: #f97316; }
  .nav-pills .nav-link { color: var(--slate-mid); font-weight: 500; }
  .nav-pills .nav-link.active { background: var(--ninox-blue); color: #fff; }
  .empty { padding: 32px 16px; text-align: center; color: var(--slate-light); }
  .update-banner { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1080; background: var(--slate-dark); color: #fff;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 18px rgba(31,32,38,.2); }
  .update-banner .inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .update-banner .btn { min-height: 44px; }
  .todo .body { flex: 1; min-width: 0; }
  .todo .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 4px; font-size: .8rem; color: var(--slate-light); }
  .todo .meta input[type=date] { width: auto; max-width: 150px; padding: 1px 6px; font-size: .8rem; }
  .todo.overdue .due { color: #dc2626; font-weight: 500; }
  .todo .txt { cursor: text; }
  .todo .edit-input { flex: 1; min-width: 0; }
  .btn-edit { border: 0; background: rgba(255,255,255,.2); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem; line-height: 1; flex: none; }
  .btn-edit:hover, .btn-edit:focus-visible { background: rgba(255,255,255,.35); }
  body { padding-bottom: env(safe-area-inset-bottom); }
  .ninox-logo svg { height: 32px; width: auto; display: block; }
  .ninox-logo .lw, .ninox-logo .li { fill: #fff; }
</style>
</head>

    <div class="d-flex align-items-center gap-2" id="titleRow">
      <h1 class="h2 mb-0" id="listTitle">To-dos</h1>
      <button class="btn-edit" id="editTitle" type="button" aria-label="Namen ändern" title="Namen ändern"><i class="bi bi-pencil" aria-hidden="true"></i></button>
    </div>
    <form id="titleForm" class="input-group mt-2" hidden>
      <input id="titleInput" class="form-control form-control-lg" maxlength="60" autocomplete="off" aria-label="Name der Liste">
      <button class="btn btn-outline-light" id="saveTitle" type="submit" disabled><i class="bi bi-floppy" aria-hidden="true"></i> Speichern</button>
      <button class="btn btn-outline-light" id="cancelTitle" type="button" aria-label="Abbrechen" title="Abbrechen (Esc)"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    </form>
  </div>
</header>

<main class="container py-4" style="max-width:720px">
  <form id="addForm" class="input-group input-group-lg mb-3">
    <datalist id="suggestions"></datalist>
    <input id="newTodo" class="form-control" maxlength="300" autocomplete="off" autofocus list="suggestions"
           placeholder="Was muss ich noch machen? (Enter zum Speichern)" aria-label="Neue Aufgabe">
    <button class="btn btn-ninox" type="submit"><i class="bi bi-plus-lg" aria-hidden="true"></i> Hinzufügen</button>
  </form>
  <div class="d-flex align-items-center gap-2 mb-3">
    <label class="small text-secondary mb-0" for="newDue"><i class="bi bi-calendar-event" aria-hidden="true"></i> Fällig bis (optional)</label>
    <input id="newDue" form="addForm" type="date" class="form-control form-control-sm" style="max-width:170px">
  </div>

  <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
    <ul class="nav nav-pills" id="filters" role="tablist" aria-label="Filter">
      <li class="nav-item"><button class="nav-link active" data-filter="open" type="button">Offen <span class="badge text-bg-light" id="cOpen">0</span></button></li>
      <li class="nav-item"><button class="nav-link" data-filter="done" type="button">Erledigt <span class="badge text-bg-light" id="cDone">0</span></button></li>
      <li class="nav-item"><button class="nav-link" data-filter="all" type="button">Alle</button></li>
    </ul>
    <button id="clearDone" class="btn btn-sm btn-outline-secondary ms-auto" type="button"><i class="bi bi-trash3" aria-hidden="true"></i> Erledigte löschen</button>
  </div>

  <div class="card-list" id="list" aria-live="polite"></div>
  <p class="small text-secondary mt-3 mb-0" id="note">Dein Stand wird in diesem Browser gespeichert. Der Stern markiert Wichtiges und sortiert es nach oben. Zum Ändern auf den Text tippen.</p>
  <div class="d-flex flex-wrap align-items-center gap-2 mt-3">
    <button id="exportBtn" class="btn btn-sm btn-outline-secondary" type="button"><i class="bi bi-download" aria-hidden="true"></i> Sichern (Export)</button>
    <button id="importBtn" class="btn btn-sm btn-outline-secondary" type="button"><i class="bi bi-upload" aria-hidden="true"></i> Laden (Import)</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
    <span class="small text-secondary" id="backupMsg" role="status"></span>
  </div>
  <p class="small text-secondary mt-4 mb-0" id="version">Version <span data-app-version>1.4.1</span></p>
</main>

<div class="update-banner" id="updateBanner" role="status" aria-live="polite" hidden>
  <div class="inner">
    <strong class="me-auto">Neue Version verfügbar</strong>
    <button class="btn btn-ninox" id="updateNow" type="button">Jetzt aktualisieren</button>
    <button class="btn btn-outline-light" id="updateLater" type="button">Später</button>
  </div>
</div>

<div class="update-banner" id="undoBar" role="status" aria-live="polite" hidden>
  <div class="inner">
    <span class="me-auto" id="undoText">Gelöscht</span>
    <button class="btn btn-ninox" id="undoBtn" type="button"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> Rückgängig</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const KEY = "nobbis-todos-v1";
let todos = [];
let filter = "open";
let canSave = true;

// Speichern wirklich ausprobieren (Schreiben und Lesen); nur dann gilt es als nicht möglich
try { localStorage.setItem("nobbis-test", "1"); canSave = localStorage.getItem("nobbis-test") === "1"; localStorage.removeItem("nobbis-test"); } catch (e) { canSave = false; }
try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { todos = []; }
if (!Array.isArray(todos)) todos = [];
// Vorschläge aus den letzten Einträgen (bleiben auch nach dem Löschen einer Aufgabe erhalten)
const HKEY = "nobbis-todos-history-v1";
let pastEntries = [];
try { pastEntries = JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) {}
if (!Array.isArray(pastEntries)) pastEntries = [];
pastEntries = pastEntries.filter(s => typeof s === "string").slice(0, 30);
function remember(text) {
  pastEntries = [text, ...pastEntries.filter(s => s.toLowerCase() !== text.toLowerCase())].slice(0, 30);
  try { localStorage.setItem(HKEY, JSON.stringify(pastEntries)); } catch (e) {}
  renderSuggestions();
}
function renderSuggestions() {
  document.getElementById("suggestions").innerHTML = pastEntries.map(s => `<option value="${String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;")}"></option>`).join("");
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) { canSave = false; showNote(); } }
function showNote() {
  if (!canSave) document.getElementById("note").textContent = "Achtung: Speichern im Browser ist hier nicht möglich (z. B. privates Fenster oder gesperrte Website-Daten). Die Aufgaben gehen beim Schließen verloren. Mit „Sichern (Export)“ kannst du sie als Datei behalten.";
}
showNote();

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const $ = id => document.getElementById(id);

// Datum als JJJJ-MM-TT (lokale Zeit), Anzeige als TT.MM.JJJJ
const dayOf = ms => { const d = new Date(ms); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fmt = s => s.split("-").reverse().join(".");
const isOverdue = t => !t.done && !!t.due && t.due < dayOf(Date.now());

function render() {
  const open = todos.filter(t => !t.done).length;
  $("cOpen").textContent = open;
  $("cDone").textContent = todos.length - open;
  let shown = todos.filter(t => filter === "all" || (filter === "done") === t.done);
  // Wichtiges nach oben, dann früheste Fälligkeit (ohne Datum zuletzt), dann neueste zuerst
  shown = shown.slice().sort((a, b) => (b.star - a.star) || ((a.due || "9999") < (b.due || "9999") ? -1 : (a.due || "9999") > (b.due || "9999") ? 1 : 0) || (b.id - a.id));
  $("list").innerHTML = shown.length ? shown.map(t => `
    <div class="todo ${t.done ? "done" : ""} ${t.star ? "important" : ""} ${isOverdue(t) ? "overdue" : ""}">
      <input class="form-check-input" type="checkbox" data-done="${t.id}" ${t.done ? "checked" : ""} aria-label="Erledigt">
      <div class="body">
      ${t.id === editingId
        ? `<input class="form-control edit-input" data-edit="${t.id}" maxlength="300" value="${esc(t.text)}" aria-label="Aufgabe bearbeiten">`
        : `<span class="txt" data-text="${t.id}" tabindex="0" role="button" title="Zum Ändern tippen">${esc(t.text)}</span>`}
      <div class="meta">
        <span title="Erstellt (automatisch)"><i class="bi bi-clock" aria-hidden="true"></i> Erstellt ${fmt(dayOf(t.created || t.id))}</span>
        <label class="due d-flex align-items-center gap-1 mb-0"><i class="bi ${isOverdue(t) ? "bi-exclamation-circle" : "bi-calendar-event"}" aria-hidden="true"></i> Fällig
          <input type="date" class="form-control form-control-sm" data-due="${t.id}" value="${esc(t.due || "")}" aria-label="Fällig bis">
        </label>
      </div>
      </div>
      <button class="star ${t.star ? "on" : ""}" data-star="${t.id}" type="button" aria-label="Wichtig umschalten" aria-pressed="${!!t.star}"><i class="bi ${t.star ? "bi-star-fill" : "bi-star"}" aria-hidden="true"></i></button>
      <button class="del" data-del="${t.id}" type="button" aria-label="Löschen"><i class="bi bi-trash3" aria-hidden="true"></i></button>
    </div>`).join("")
    : `<div class="empty"><i class="bi ${filter === "open" && todos.length ? "bi-check2-circle" : "bi-journal-check"} d-block fs-1 mb-2" aria-hidden="true"></i>${filter === "open" ? (todos.length ? "Nichts mehr offen." : "Noch keine Aufgaben. Oben die erste eintragen.") : "Hier ist noch nichts."}</div>`;
  $("clearDone").hidden = todos.length === open;
  if (editingId) { const i = document.querySelector("[data-edit]"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
}

// Aufgabentext ändern: antippen, Enter oder wegtippen speichert, Esc bricht ab
let editingId = null;
function finishEdit(commit) {
  if (editingId === null) return;
  const i = document.querySelector("[data-edit]"), t = todos.find(x => x.id === editingId);
  editingId = null;
  const v = i ? i.value.trim() : "";
  if (commit && t && v && v !== t.text) { t.text = v; remember(v); save(); }
  render();
}
function startEdit(id) { editingId = +id; render(); }
$("list").addEventListener("keydown", e => {
  if (e.target.matches("[data-edit]")) {
    if (e.key === "Enter") { e.preventDefault(); finishEdit(true); }
    else if (e.key === "Escape") finishEdit(false);
  } else if (e.target.matches("[data-text]") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); startEdit(e.target.dataset.text); }
});
$("list").addEventListener("focusout", e => { if (e.target.matches("[data-edit]")) finishEdit(true); });

// Rückgängig nach dem Löschen (6 Sekunden)
let undoItems = [], undoTimer = null;
function offerUndo(items, text) {
  undoItems = items; $("undoText").textContent = text; $("undoBar").hidden = false;
  clearTimeout(undoTimer); undoTimer = setTimeout(() => { $("undoBar").hidden = true; undoItems = []; }, 6000);
}
$("undoBtn").addEventListener("click", () => {
  todos = todos.concat(undoItems); undoItems = []; $("undoBar").hidden = true; clearTimeout(undoTimer);
  save(); render();
});

// Sichern und Laden als JSON-Datei
const say = m => { $("backupMsg").textContent = m; };
$("exportBtn").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ title, todos }, null, 2)], { type: "application/json" }));
  a.download = "todos-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click(); URL.revokeObjectURL(a.href);
  say(todos.length + " Aufgabe(n) gesichert.");
});
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", async () => {
  const f = $("importFile").files[0]; $("importFile").value = "";
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const list = Array.isArray(data) ? data : data.todos;
    if (!Array.isArray(list)) throw new Error("format");
    const have = new Set(todos.map(t => t.id));
    const add = list.filter(t => t && typeof t.text === "string" && t.text.trim() && !have.has(t.id))
      .map((t, n) => {
        const id = Number.isFinite(+t.id) ? +t.id : Date.now() + n;
        return { id, created: Number.isFinite(+t.created) && +t.created > 0 ? +t.created : id, text: t.text.trim().slice(0, 300), done: !!t.done, star: t.star ? 1 : 0, due: /^\d{4}-\d{2}-\d{2}$/.test(t.due) ? t.due : "" };
      });
    todos = todos.concat(add); save(); render();
    say(add.length + " Aufgabe(n) geladen" + (list.length - add.length ? ", " + (list.length - add.length) + " schon vorhanden oder ungültig." : "."));
  } catch (e) { say("Diese Datei konnte nicht gelesen werden."); }
});

$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("newTodo").value.trim();
  if (!v) return;
  const now = Date.now();
  todos.push({ id: now, created: now, text: v, done: false, star: 0, due: $("newDue").value });
  $("newTodo").value = ""; $("newDue").value = "";
  if (filter === "done") setFilter("open");
  remember(v);
  save(); render(); $("newTodo").focus();
});

// Fälligkeitsdatum ändern (das Erstellungsdatum bleibt unveränderlich)
$("list").addEventListener("change", e => {
  const d = e.target.closest("[data-due]");
  if (!d) return;
  const o = todos.find(x => x.id === +d.dataset.due);
  if (o) { o.due = d.value; save(); render(); }
});

$("list").addEventListener("click", e => {
  const t = id => todos.find(x => x.id === +id);
  const d = e.target.closest("[data-done]"), s = e.target.closest("[data-star]"), x = e.target.closest("[data-del]");
  if (d) t(d.dataset.done).done = d.checked;
  else if (s) { const o = t(s.dataset.star); o.star = o.star ? 0 : 1; }
  else if (x) { offerUndo(todos.filter(o => o.id === +x.dataset.del), "Aufgabe gelöscht."); todos = todos.filter(o => o.id !== +x.dataset.del); }
  else if (e.target.closest("[data-text]")) { startEdit(e.target.closest("[data-text]").dataset.text); return; }
  else return;
  save(); render();
});

function setFilter(f) {
  filter = f;
  document.querySelectorAll("#filters .nav-link").forEach(b => b.classList.toggle("active", b.dataset.filter === f));
}
$("filters").addEventListener("click", e => {
  const b = e.target.closest("[data-filter]");
  if (b) { setFilter(b.dataset.filter); render(); }
});
$("clearDone").addEventListener("click", () => {
  const gone = todos.filter(t => t.done);
  if (gone.length) { offerUndo(gone, gone.length + " erledigte Aufgabe(n) gelöscht."); todos = todos.filter(t => !t.done); save(); render(); }
});

// Name der Liste (änderbar, bleibt im Browser gespeichert)
const TKEY = "nobbis-todos-title-v1", DEFAULT_TITLE = "To-dos";
let title = DEFAULT_TITLE;
try { title = (localStorage.getItem(TKEY) || "").trim() || DEFAULT_TITLE; } catch (e) {}
function showTitle() {
  $("listTitle").textContent = title;
  document.title = title;
  document.querySelector('meta[name="apple-mobile-web-app-title"]').content = title;
}
let titleSaved = title; // zuletzt gespeicherter Name
const draftTitle = () => $("titleInput").value.trim() || DEFAULT_TITLE;
function toggleTitleEdit(on) {
  $("editTitle").hidden = on;
  $("titleForm").hidden = !on;
  if (on) { $("titleInput").value = titleSaved; updateSaveBtn(); $("titleInput").focus(); $("titleInput").select(); }
}
// Speichern-Button ist nur aktiv, wenn sich der Name geändert hat
function updateSaveBtn() {
  const changed = draftTitle() !== titleSaved;
  $("saveTitle").disabled = !changed;
  $("saveTitle").classList.toggle("btn-light", changed);
  $("saveTitle").classList.toggle("btn-outline-light", !changed);
}
function cancelTitleEdit() { title = titleSaved; showTitle(); toggleTitleEdit(false); }
$("editTitle").addEventListener("click", () => toggleTitleEdit(true));
// Beim Tippen sofort oben anzeigen (gespeichert wird erst mit „Speichern“)
$("titleInput").addEventListener("input", () => { title = draftTitle(); showTitle(); updateSaveBtn(); });
$("titleForm").addEventListener("submit", e => {
  e.preventDefault();
  if (draftTitle() === titleSaved) return;
  title = titleSaved = draftTitle();
  try { localStorage.setItem(TKEY, title); } catch (err) { canSave = false; showNote(); }
  showTitle(); toggleTitleEdit(false);
});
$("cancelTitle").addEventListener("click", cancelTitleEdit);
$("titleInput").addEventListener("keydown", e => { if (e.key === "Escape") cancelTitleEdit(); });
showTitle();

renderSuggestions();
render();

// PWA: Service Worker anmelden und bei neuer Version „Neue Version verfügbar“ zeigen.
// Funktioniert nur über https (oder localhost), nicht beim Öffnen der Datei direkt vom Rechner.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  const banner = $("updateBanner");
  let waiting = null, reloading = false;
  const offer = worker => { waiting = worker; banner.hidden = false; };

  navigator.serviceWorker.register("sw.js").then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener("statechange", () => {
        // „installed“ mit bestehendem Controller = es läuft schon eine ältere Version
        if (nw.state === "installed" && navigator.serviceWorker.controller) offer(nw);
      });
    });
    // Auf neue Version prüfen: beim Zurückkehren in die App und stündlich
    const check = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
    setInterval(check, 60 * 60 * 1000);
  }).catch(() => {});

  $("updateNow").addEventListener("click", () => { if (waiting) waiting.postMessage("SKIP_WAITING"); });
  $("updateLater").addEventListener("click", () => { banner.hidden = true; });
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
}
</script>
</body>
</html>
